# zhiku 反向代理示例：放到 /etc/nginx/sites-available/zhiku 后软链到 sites-enabled
# 关键点：SSE 流式回答必须关闭缓冲，否则前端会等到全部生成完才一次性显示
server {
    listen 80;
    server_name zhiku.example.com;   # 没有域名就改成服务器 IP，或先删掉默认站点用 _

    client_max_body_size 200m;       # 留够上传/导入备份的空间

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat 是 SSE 流式返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
